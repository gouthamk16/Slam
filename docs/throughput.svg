<svg xmlns="http://www.w3.org/2000/svg" width="760" height="212" viewBox="0 0 760 212" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Throughput on the same 500 frames: 1.1 fps single-threaded, 6.4 fps with worker threads</title>
  <rect x="0.5" y="0.5" width="759" height="211" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#0b0b0b">Threading is where the speed came from</text>
  <text x="24" y="54" font-size="12" fill="#52514e">same 500 frames of KITTI 00 · full local BA and loop closing in both runs</text>

  <g stroke="#e1e0d9">
    <line x1="405" y1="78" x2="405" y2="172"/>
    <line x1="510" y1="78" x2="510" y2="172"/>
    <line x1="615" y1="78" x2="615" y2="172"/>
    <line x1="720" y1="78" x2="720" y2="172"/>
  </g>
  <line x1="300" y1="78" x2="300" y2="172" stroke="#c3c2b7"/>

  <text x="288" y="107" font-size="13" fill="#0b0b0b" text-anchor="end">mapping inline</text>
  <rect x="300" y="92" width="58" height="22" rx="4" fill="#2a78d6"/>
  <text x="366" y="108" font-size="12" font-weight="600" fill="#0b0b0b">1.1 fps</text>

  <text x="288" y="153" font-size="13" fill="#0b0b0b" text-anchor="end">mapping + loop on worker threads</text>
  <rect x="300" y="138" width="336" height="22" rx="4" fill="#2a78d6"/>
  <text x="644" y="154" font-size="12" font-weight="600" fill="#0b0b0b">6.4 fps</text>

  <g font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">
    <text x="300" y="188">0</text>
    <text x="405" y="188">2</text>
    <text x="510" y="188">4</text>
    <text x="615" y="188">6</text>
    <text x="720" y="188">8</text>
  </g>
  <text x="300" y="204" font-size="11" fill="#898781">frames per second</text>
</svg>
