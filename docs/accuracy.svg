<svg xmlns="http://www.w3.org/2000/svg" width="760" height="216" viewBox="0 0 760 216" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>ATE on KITTI 00: previous code 49.33 m, this system 1.73 m, ORB-SLAM2 paper 1.30 m</title>
  <rect x="0.5" y="0.5" width="759" height="215" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#0b0b0b">Absolute trajectory error on KITTI 00 — lower is better</text>
  <text x="24" y="54" font-size="12" fill="#52514e">4541 frames, 3.7 km driven, 0 lost frames, 4 loop closures</text>

  <text x="24" y="82" font-size="12" font-weight="600" fill="#0b0b0b">before → after</text>
  <line x1="24" y1="92" x2="24" y2="180" stroke="#c3c2b7"/>
  <text x="34" y="106" font-size="12" fill="#52514e">previous code</text>
  <rect x="24" y="112" width="285" height="22" rx="4" fill="#eb6834"/>
  <text x="315" y="128" font-size="12" font-weight="600" fill="#0b0b0b" font-variant-numeric="tabular-nums">49.33 m</text>
  <text x="34" y="154" font-size="12" fill="#52514e">this system</text>
  <rect x="24" y="160" width="10" height="18" rx="4" fill="#2a78d6"/>
  <text x="42" y="174" font-size="12" font-weight="600" fill="#0b0b0b" font-variant-numeric="tabular-nums">1.73 m</text>

  <text x="400" y="82" font-size="12" font-weight="600" fill="#0b0b0b">against the C++ reference</text>
  <line x1="400" y1="92" x2="400" y2="180" stroke="#c3c2b7"/>
  <text x="410" y="106" font-size="12" fill="#52514e">this system — NumPy</text>
  <rect x="400" y="112" width="260" height="22" rx="4" fill="#2a78d6"/>
  <text x="666" y="128" font-size="12" font-weight="600" fill="#0b0b0b" font-variant-numeric="tabular-nums">1.73 m</text>
  <text x="410" y="154" font-size="12" fill="#52514e">ORB-SLAM2 — C++, published</text>
  <rect x="400" y="160" width="195" height="18" rx="4" fill="#86b6ef"/>
  <text x="601" y="174" font-size="12" font-weight="600" fill="#0b0b0b" font-variant-numeric="tabular-nums">1.30 m</text>

  <text x="24" y="202" font-size="11" fill="#898781">each panel has its own scale</text>
</svg>
